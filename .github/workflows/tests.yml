name: Checks

# Runs on pull requests (feature work) and on pushes to main (post-merge). A PR
# branch is covered by its pull_request run, so it isn't tested twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    # Production is Postgres, local dev is SQLite: the same suite runs on both. Pint and
    # PHPStan don't depend on the database, so they run once, in the sqlite leg.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]

    # Only the pgsql leg starts a database; an empty image leaves the sqlite leg without one.
    services:
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: pesonal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The Laravel app lives in api/, not the repo root, so every run step works there.
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      # Mirror local dev: PHP 8.4 with the same extensions the app needs.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # No .env is committed; the app needs an APP_KEY to boot. phpunit.xml still
      # overrides the DB to in-memory sqlite, unless the step's env says otherwise.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (sqlite)
        if: matrix.db == 'sqlite'
        run: php artisan test

      # phpunit.xml's <env> only fills variables that aren't already set, so these real env
      # vars win over its in-memory sqlite. They match the postgres service above.
      - name: Tests (pgsql)
        if: matrix.db == 'pgsql'
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pesonal_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Code style (Pint)
        if: matrix.db == 'sqlite'
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        if: matrix.db == 'sqlite'
        run: composer analyse -- --no-progress

  web:
    runs-on: ubuntu-latest

    # The Nuxt app lives in web/, not the repo root, so every run step works there.
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md: Node must be 22.18+ (Babel 8). '22' resolves to the latest 22.x,
      # which satisfies that. The cache key is the lockfile, which lives in web/.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci installs exactly what the lockfile says and fails if it and
      # package.json disagree. Its postinstall (nuxt prepare) also generates the
      # .nuxt types that typecheck needs, so no separate prepare step is required.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx nuxt typecheck

      - name: Lint
        run: npm run lint

  # The production image, built and started the way Render runs it: env only, no .env file,
  # Postgres, the proxy gate on, and the entrypoint migrating and caching before it serves.
  # Only after the api checks pass, so a red test suite doesn't also spend a docker build.
  docker:
    needs: [api]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pesonal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag pesonal-api api

      # Production-like env. APP_KEY is generated fresh per run (it guards nothing here).
      # --network host lets the container reach the postgres service on 127.0.0.1:5432
      # and lets the steps below reach the API on 127.0.0.1:8080.
      - name: Start the container
        run: |
          cat > ci.env <<ENV
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_URL=http://localhost:8080
          FRONTEND_URL=http://localhost:3000
          PORT=8080
          LOG_CHANNEL=stderr
          DB_CONNECTION=pgsql
          DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/pesonal
          SESSION_DRIVER=database
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          PROXY_SECRET=ci-secret
          ENV
          docker run --detach --name api --network host --env-file ci.env pesonal-api

      # /up only answers once migrations and caches are done (the server starts after them).
      # A container that exits while we wait fails at once instead of timing out.
      - name: Wait for /up
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/up; then
              echo "/up answered after ${attempt} tries"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' api)" != "true" ]; then
              echo "::error::the container exited before /up answered"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/up did not answer within 120 s"
          exit 1

      - name: Smoke checks
        run: |
          failed=0
          # check <expected status> <method> <path> [curl args...]: the body lands in body.txt.
          check() {
            local expected=$1 method=$2 path=$3
            shift 3
            local status
            status=$(curl --silent --output body.txt --write-out '%{http_code}' \
              --request "$method" --header 'Accept: application/json' "$@" "http://127.0.0.1:8080$path")
            if [ "$status" = "$expected" ]; then
              echo "ok   $method $path $* -> $status"
            else
              echo "::error::$method $path $* answered $status, expected $expected"
              cat body.txt; echo
              failed=1
            fi
          }

          check 200 GET /up
          # Without the proxy header every other path is a missing route.
          check 404 GET /api/user
          # With it, the request reaches auth: a JSON 401.
          check 401 GET /api/user --header 'X-Pesonal-Proxy: ci-secret'
          grep --quiet '"message"' body.txt || { echo "::error::the 401 is not JSON"; cat body.txt; failed=1; }
          # The restore route resolves under the cached routes: auth answers 401, where a lost
          # route would be a 404 and a lost binding a 500.
          check 401 POST /api/expenses/999999/restore --header 'X-Pesonal-Proxy: ci-secret'
          if grep --quiet 'could not be found' body.txt; then echo "::error::the restore route is missing"; failed=1; fi
          check 401 POST /api/recurring/999999/restore --header 'X-Pesonal-Proxy: ci-secret'

          # The entrypoint really cached: a missing file means the checks above ran uncached.
          docker exec api sh -c 'ls bootstrap/cache/config.php bootstrap/cache/routes-v*.php bootstrap/cache/events.php' \
            || { echo "::error::a cache file is missing"; failed=1; }

          exit $failed

      - name: Both processes are still running after 30 s
        run: |
          sleep 30
          docker top api
          processes=$(docker top api -eo args)
          echo "$processes" | grep --quiet 'frankenphp run' || { echo "::error::the web server is gone"; exit 1; }
          echo "$processes" | grep --quiet 'artisan schedule:work' || { echo "::error::the scheduler is gone"; exit 1; }
          [ "$(docker inspect --format '{{.State.Running}}' api)" = "true" ]

      - name: Container logs
        if: failure()
        run: |
          docker ps --all
          docker logs api || true