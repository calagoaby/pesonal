name: Checks

# Runs on pull requests (feature work) and on pushes to main (post-merge). A PR
# branch is covered by its pull_request run, so it isn't tested twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    # Production is Postgres, local dev is SQLite: the same suite runs on both. Pint and
    # PHPStan don't depend on the database, so they run once, in the sqlite leg.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]

    # Only the pgsql leg starts a database; an empty image leaves the sqlite leg without one.
    services:
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: pesonal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The Laravel app lives in api/, not the repo root, so every run step works there.
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      # Mirror local dev: PHP 8.4 with the same extensions the app needs.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # No .env is committed; the app needs an APP_KEY to boot. phpunit.xml still
      # overrides the DB to in-memory sqlite, unless the step's env says otherwise.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (sqlite)
        if: matrix.db == 'sqlite'
        run: php artisan test

      # phpunit.xml's <env> only fills variables that aren't already set, so these real env
      # vars win over its in-memory sqlite. They match the postgres service above.
      - name: Tests (pgsql)
        if: matrix.db == 'pgsql'
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pesonal_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Code style (Pint)
        if: matrix.db == 'sqlite'
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        if: matrix.db == 'sqlite'
        run: composer analyse -- --no-progress

  web:
    runs-on: ubuntu-latest

    # The Nuxt app lives in web/, not the repo root, so every run step works there.
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md: Node must be 22.18+ (Babel 8). '22' resolves to the latest 22.x,
      # which satisfies that. The cache key is the lockfile, which lives in web/.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci installs exactly what the lockfile says and fails if it and
      # package.json disagree. Its postinstall (nuxt prepare) also generates the
      # .nuxt types that typecheck needs, so no separate prepare step is required.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx nuxt typecheck

      - name: Lint
        run: npm run lint

  # The production image, built and started the way Render runs it: env only, no .env file,
  # Postgres, the proxy gate on, and the entrypoint migrating and caching before it serves.
  # Only after the api checks pass, so a red test suite doesn't also spend a docker build.
  docker:
    needs: [api]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pesonal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag pesonal-api api

      # Production-like env. APP_KEY is generated fresh per run (it guards nothing here).
      # --network host lets the container reach the postgres service on 127.0.0.1:5432
      # and lets the steps below reach the API on 127.0.0.1:8080.
      - name: Start the container
        run: |
          cat > ci.env <<ENV
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_URL=http://localhost:8080
          FRONTEND_URL=http://localhost:3000
          PORT=8080
          LOG_CHANNEL=stderr
          DB_CONNECTION=pgsql
          DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/pesonal
          SESSION_DRIVER=database
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          PROXY_SECRET=ci-secret
          ENV
          docker run --detach --name api --network host --env-file ci.env pesonal-api

      # /up only answers once migrations and caches are done (the server starts after them).
      # A container that exits while we wait fails at once instead of timing out.
      - name: Wait for /up
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/up; then
              echo "/up answered after ${attempt} tries"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' api)" != "true" ]; then
              echo "::error::the container exited before /up answered"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/up did not answer within 120 s"
          exit 1

      - name: Smoke checks
        run: |
          failed=0
          # check <expected status> <method> <path> [curl args...]: the body lands in body.txt.
          check() {
            local expected=$1 method=$2 path=$3
            shift 3
            local status
            status=$(curl --silent --output body.txt --write-out '%{http_code}' \
              --request "$method" --header 'Accept: application/json' "$@" "http://127.0.0.1:8080$path")
            if [ "$status" = "$expected" ]; then
              echo "ok   $method $path $* -> $status"
            else
              echo "::error::$method $path $* answered $status, expected $expected"
              cat body.txt; echo
              failed=1
            fi
          }

          check 200 GET /up
          # Without the proxy header every other path is a missing route.
          check 404 GET /api/user
          # With it, the request reaches auth: a JSON 401.
          check 401 GET /api/user --header 'X-Pesonal-Proxy: ci-secret'
          grep --quiet '"message"' body.txt || { echo "::error::the 401 is not JSON"; cat body.txt; failed=1; }
          # The restore routes survive route:cache: auth answers 401, where a lost route would be
          # a 404. Without a session auth stops the request first, so this doesn't reach the
          # voided-row binding; the test suite covers that.
          check 401 POST /api/expenses/999999/restore --header 'X-Pesonal-Proxy: ci-secret'
          if grep --quiet 'could not be found' body.txt; then echo "::error::the restore route is missing"; failed=1; fi
          check 401 POST /api/recurring/999999/restore --header 'X-Pesonal-Proxy: ci-secret'

          # The entrypoint's optimize really cached: a missing file means the checks above ran uncached.
          docker exec api sh -c 'ls bootstrap/cache/config.php bootstrap/cache/routes-v*.php bootstrap/cache/events.php' \
            || { echo "::error::a cache file is missing"; failed=1; }

          exit $failed

      - name: Both processes are still running after 30 s
        run: |
          sleep 30
          # docker top passes these options to ps, and the daemon needs a pid column in the output.
          processes=$(docker top api -eo pid,args)
          echo "$processes"
          echo "$processes" | grep --quiet 'frankenphp run' || { echo "::error::the web server is gone"; exit 1; }
          echo "$processes" | grep --quiet 'artisan schedule:work' || { echo "::error::the scheduler is gone"; exit 1; }
          [ "$(docker inspect --format '{{.State.Running}}' api)" = "true" ]

      - name: Container logs
        if: failure()
        run: |
          docker ps --all
          docker logs api || true

  # The frontend goes live only after every check above is green. Vercel's own Git deploys are
  # off (web/vercel.json), so this job is the only way a commit reaches production. deploy-api
  # waits for it, so a failed frontend deploy holds the API back.
  deploy-web:
    needs: [api, web, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Two quick pushes deploy one after the other, never side by side; the newer one lands last.
    concurrency:
      group: deploy-web
      cancel-in-progress: false

    # The CLI reads these instead of a linked .vercel/project.json.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Secrets can't appear in a job's `if:`, so a step reads the token and says whether to go on.
      # Until the owner adds VERCEL_TOKEN the job ends green with a notice, not red.
      - name: Check the Vercel secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set, so the frontend was not deployed"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      # vercel build runs the Nuxt build on this runner, so it needs the same Node as the web job.
      - name: Set up Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Run from the repo root, not web/: the project's Root Directory setting (web) is joined onto
      # the current directory, so running inside web/ would look for web/web. The CLI is pinned so a
      # new release can't change the deploy under us; bump it deliberately.
      - name: Pull the production settings and env
        if: steps.gate.outputs.enabled == 'true'
        run: npx --yes vercel@63.0.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # NITRO_PRESET pins Nuxt's output to Vercel's format. Without it a project whose framework
      # setting isn't Nuxt builds a plain Node server, and Vercel then hunts for a static "dist".
      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        run: npx --yes vercel@63.0.2 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NITRO_PRESET: vercel

      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        run: npx --yes vercel@63.0.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # Render's own "After CI Checks Pass" never fired on a green push (2026-10-27), so its
  # Auto-Deploy is Off and this job starts the deploy through the service's deploy hook. The hook
  # only queues the deploy: a failed boot shows in Render's Events, not here.
  deploy-api:
    needs: [deploy-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-api
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only a push that touches api/ restarts the API, as Render's root directory did. An unknown
      # `before` (a new branch, a force-push) deploys to be safe.
      - name: Check for API changes
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- api/; then
            echo "::notice::Nothing under api/ changed, so the API was not redeployed"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # Ends green with a notice while the secret is missing, like the Vercel gate. The hook URL is
      # a secret (anyone holding it can deploy), so the response body isn't printed.
      - name: Trigger the Render deploy
        if: steps.changed.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK is not set, so the API was not deployed"
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy queued for $GITHUB_SHA"