; On top of php.ini-production.

; The code never changes inside a running container, so opcache never re-checks files.
; The caches the entrypoint writes (config, routes, events) exist before the server starts.
opcache.enable=1
opcache.validate_timestamps=0
; Small on purpose: the whole app plus vendor/ fits well inside it, and RAM is 512 MB.
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000

expose_php=Off