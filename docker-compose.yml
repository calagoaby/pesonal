services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app          # live-mount Laravel source → edits reflect immediately
    environment:
      APP_ENV: local

  web:
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app          # live-mount Nuxt source
      - /app/node_modules   # keep the image's node_modules, don't let the host shadow it
    environment:
      # Server-side renders run inside this container, where localhost is the
      # container itself, so they reach Laravel by its service name. The browser
      # can't resolve service names; it uses nuxt.config's http://localhost:8000.
      NUXT_API_BASE: "http://api:8000"
    depends_on:
      - api