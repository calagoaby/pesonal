services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app          # live-mount Laravel source → edits reflect immediately
    environment:
      APP_ENV: local

  web:
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app          # live-mount Nuxt source
      - /app/node_modules   # keep the image's node_modules, don't let the host shadow it
    environment:
      # Empty while the frontend runs on the mock routes in web/server/api.
      # Restore "http://localhost:8000" to point at Laravel — browser-side calls
      # go to the host, so localhost, not the service name.
      NUXT_PUBLIC_API_BASE: ""
    depends_on:
      - api